name: Refresh Disciple Hinson catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * *'
permissions:
  contents: write
concurrency:
  group: disciple-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh and validate episodes, themes and platform links
        run: python refresh.py
      - name: Save updated catalog
        run: |
          git config user.name 'Hinson podcast catalog updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/episodes.json dist/episode-themes.json dist/podcast-links.json catalog-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Disciple Hinson podcast catalog'
            git push
          fi
